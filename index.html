<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game X</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #ffffff;
    --ink: #18181b;
    --muted: #71717a;
    --card: #f4f4f5;
    --lime: #a3e635;
    --lime-glow: rgba(163, 230, 53, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #000000;
      --ink: #fafafa;
      --muted: #a1a1aa;
      --card: #18181b;
      --lime: #bef264;
      --lime-glow: rgba(190, 242, 100, 0.3);
    }
  }
  html, body { margin: 0; background: var(--page); }
  body {
    box-sizing: border-box;
    min-height: 100vh;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  #layout { display: flex; gap: 20px; align-items: flex-start; }
  #layout.narrow { flex-direction: column; align-items: stretch; gap: 16px; }

  /* Title and live scoreboard */
  #panel { color: var(--ink); }
  #layout.wide #panel { width: 240px; flex: none; position: sticky; top: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .mark { width: 22px; height: 22px; border-radius: 7px; background: var(--lime); box-shadow: 0 0 14px var(--lime-glow); }
  #layout.wide .cards { display: flex; flex-direction: column; gap: 10px; }
  #layout.narrow .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
  .card { background: var(--card); border-radius: 14px; padding: 10px 14px; }
  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card .unit { font-size: 13px; font-weight: 600; color: var(--muted); }
  .lives { display: inline-flex; gap: 6px; align-items: center; height: 29px; }
  .lives i { width: 14px; height: 14px; border-radius: 50%; background: var(--lime); }
  .lives i.off { background: var(--muted); opacity: 0.35; }

  /* The lime frame, which reacts to the game */
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  #padHost { display: flex; justify-content: center; }
  #padHost:empty { display: none; }
  #frame {
    flex: none;
    min-width: 0;
    box-sizing: border-box;
    border: 6px solid var(--frame, var(--lime));
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 0 28px var(--frame-glow, var(--lime-glow));
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  #frame.is-fs { border-width: 0; border-radius: 0; box-shadow: none; overflow: auto; min-height: 100vh; }
  #frame.fx-hunter { animation: hunterGlow 1.1s ease-in-out infinite; }
  #frame.fx-eat { animation: eatPulse 0.45s ease-out; }
  #frame.fx-life { border-color: #fbbf24; box-shadow: 0 0 34px rgba(251, 191, 36, 0.55); animation: none; }
  #frame.fx-over { border-color: #ef4444; box-shadow: 0 0 34px rgba(239, 68, 68, 0.6); animation: overFlash 0.5s ease-in-out 4; }
  @keyframes eatPulse {
    0% { box-shadow: 0 0 12px var(--frame-glow, var(--lime-glow)); }
    30% { box-shadow: 0 0 46px var(--frame, var(--lime)), 0 0 0 3px var(--frame, var(--lime)); }
    100% { box-shadow: 0 0 28px var(--frame-glow, var(--lime-glow)); }
  }
  @keyframes hunterGlow {
    0%, 100% { box-shadow: 0 0 30px var(--frame-glow, var(--lime-glow)); }
    50% { box-shadow: 0 0 60px 6px var(--frame, var(--lime)); }
  }
  @keyframes overFlash {
    0%, 100% { border-color: #ef4444; box-shadow: 0 0 34px rgba(239, 68, 68, 0.6); }
    50% { border-color: #fecaca; box-shadow: 0 0 70px 8px rgba(239, 68, 68, 0.9); }
  }
  @media (prefers-reduced-motion: reduce) {
    #frame.fx-hunter, #frame.fx-eat, #frame.fx-over { animation: none; }
  }
</style>
